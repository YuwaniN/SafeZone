name: SafeZone
options:
  bundleIdPrefix: lk.safezone
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic

targets:
  SafeZone:
    type: application
    platform: iOS
    sources:
      - path: SafeZone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lk.safezone.app
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: ""
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    scheme:
      testTargets:
        - SafeZoneTests
      gatherCoverageData: true

  SafeZoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SafeZoneTests
    dependencies:
      - target: SafeZone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lk.safezone.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SafeZone.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SafeZone"
        BUNDLE_LOADER: "$(TEST_HOST)"
